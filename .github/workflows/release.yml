# 打 tag 即发布：v1.1.0 -> 构建安装器 -> GitHub Release
#
# 用 GitHub 自带的 gh CLI 而不是第三方 action，避免为发布流程引入外部依赖。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v1.1.0'
        required: true
        type: string

permissions:
  contents: write

# 同一个 tag 不并发跑两次发布
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check that version.txt matches the tag
        shell: powershell
        run: |
          $tag = '${{ github.event.inputs.tag || github.ref_name }}' -replace '^v', ''
          $ver = (Get-Content .\version.txt -First 1).Trim()
          if ($tag -ne $ver) { throw "tag is v$tag but version.txt says $ver" }
          Write-Host ("releasing " + $ver)

      - name: Unit tests (63)
        shell: powershell
        run: .\tests\run-tests.ps1

      - name: Build the app and the installer
        shell: powershell
        run: .\build-setup.ps1

      - name: Checksum
        shell: powershell
        run: |
          $files = @(Get-ChildItem .\dist\Caffeine-Setup-*.exe)
          $files += (Get-ChildItem .\dist\Caffeine.exe)
          $lines = @()
          foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += ($h + '  ' + $f.Name)
          }
          $lines | Out-File -FilePath .\dist\SHA256SUMS.txt -Encoding ascii
          Get-Content .\dist\SHA256SUMS.txt

      - name: Create the GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $setup = (Get-ChildItem .\dist\Caffeine-Setup-*.exe | Select-Object -First 1)
          $bare  = (Get-ChildItem .\dist\Caffeine.exe | Select-Object -First 1)
          $ver   = ($env:TAG -replace '^v', '')
          $notes = @(
            "安装（推荐）：下载 Caffeine-Setup-$ver.exe，双击即可，按用户安装、不需要管理员。",
            '',
            '免安装：下载 Caffeine.exe 丢到任意目录双击运行。',
            '',
            '安装包未做代码签名。双击时若弹出「Windows 已保护你的电脑」，点「更多信息」再点「仍要运行」即可。',
            '',
            '校验：SHA256SUMS.txt 里有上面两个文件的 SHA256。',
            '',
            '变更内容见仓库里的 CHANGELOG.md。'
          ) -join [Environment]::NewLine
          # Set-Content -Encoding UTF8 would prepend a BOM under PowerShell 5.1,
          # and gh passes that file through verbatim, so the release notes would
          # start with a stray U+FEFF.  Write UTF-8 without one.
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($notesFile, $notes, $utf8NoBom)

          # NOTE: `gh release create` has NO --yes flag (only `gh release
          # delete` does).  Adding it makes gh abort with "unknown flag" before
          # it contacts the API at all.  Verified on the runner against the
          # command's own usage output.
          $ghArgs = @(
            'release', 'create', $env:TAG,
            '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag',
            '--title', ('Caffeine ' + $env:TAG),
            '--notes-file', $notesFile,
            $setup.FullName,
            $bare.FullName,
            '.\dist\SHA256SUMS.txt'
          )
          # Capture gh's output into a FILE, not via 2>&1.  GitHub's PowerShell
          # wrapper pre-sets $ErrorActionPreference='stop', and redirecting a
          # native command's stderr with 2>&1 turns each stderr line into an
          # ErrorRecord, so the very first one kills the script before any
          # error handling runs - which is why a bare failure here shows up as
          # nothing but "exit code 1".  `*> file` bypasses that, and it is
          # verified working on this runner.  The message is echoed as an
          # ::error:: annotation because GitHub requires a signed-in session to
          # show step logs even on a public repo, while annotations are public.
          $ghLog = Join-Path $env:RUNNER_TEMP 'gh.log'
          & gh @ghArgs *> $ghLog
          $ghExit = $LASTEXITCODE
          $ghMsg = ((Get-Content $ghLog -Raw) -replace '\r?\n', ' | ').Trim()
          Write-Host ("gh exit=" + $ghExit + " :: " + $ghMsg)
          if ($ghExit -ne 0) {
              Write-Host ("::error title=gh release create::exit=" + $ghExit + " :: " + $ghMsg.Replace('%', '%25'))
              throw ("gh release create failed (exit " + $ghExit + "): " + $ghMsg)
          }

      - name: Show the release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release view $env:TAG --json url,tagName,assets
